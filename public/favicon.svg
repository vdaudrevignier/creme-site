<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 330">
  <!-- The "C" of the C.R.E.M.E logo (src/assets/logo.png), on a dark tile so it reads on light and dark tabs -->
  <defs>
    <mask id="slots">
      <path fill="#fff" d="M10 0H245V288a10 10 0 0 1-10 10H0V10A10 10 0 0 1 10 0Z" />
      <!-- left gap: rounded on its inner end -->
      <path fill="#000" d="M-1 149H15.5a15.5 15.5 0 0 1 0 31H-1Z" />
      <!-- right gap: rounded on its inner end, open to the right -->
      <path fill="#000" d="M246 149H114.5a15.5 15.5 0 0 0 0 31H246Z" />
    </mask>
  </defs>
  <rect width="330" height="330" rx="56" fill="#050805" />
  <g transform="translate(42.5 16)">
    <rect width="245" height="298" fill="#39ff7a" mask="url(#slots)" />
  </g>
</svg>
